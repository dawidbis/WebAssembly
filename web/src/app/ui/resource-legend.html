@if (store.view() === 'resources') {
  <details class="frame legend" [open]="open">
    <summary>
      <span class="title">Zasoby</span>
      <button type="button" class="bulk" (click)="setAll(true, $event)" title="Zaznacz wszystkie zasoby (W)">Wszystkie</button>
      <button type="button" class="bulk" (click)="setAll(false, $event)" title="Odznacz wszystkie zasoby (Z)">Żadne</button>
    </summary>
    <p class="kinds" aria-label="Surowce według zaopatrzenia">
      @for (c of categories(); track c.index) {
        <button type="button" class="bulk" [class.active]="c.active" [attr.aria-pressed]="c.active" (click)="onlyCategory(c.index)" [title]="c.title">{{ c.name }}</button>
      }
    </p>
    @for (g of groups(); track g.name) {
      <section [attr.aria-label]="g.name">
        <button type="button" class="group" [class.active]="g.active" [attr.aria-pressed]="g.active" (click)="only(g.index)" [title]="g.active ? 'Pokaż wszystkie' : 'Pokaż tylko: ' + g.name">
          {{ g.name }}
        </button>
        <ul>
          @for (r of g.items; track r.index) {
            <li>
              <button
                type="button"
                class="item"
                [class.off]="!r.on"
                [class.absent]="r.count === 0"
                [attr.aria-pressed]="r.on"
                (click)="toggle(r.index)"
              >
                <app-goods-icon class="swatch" [resource]="r.index" [size]="17" />
                <span class="name">{{ r.name }}</span>
                <span class="count" title="Liczba prowincji z tym zasobem">{{ r.count ?? '…' }}</span>
              </button>
            </li>
          }
        </ul>
      </section>
    }
  </details>
}
