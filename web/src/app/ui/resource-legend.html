@if (store.view() === 'resources') {
  <details class="frame legend" [open]="open">
    <summary>
      <span class="title">Zasoby</span>
      <button type="button" class="bulk" (click)="setAll(true, $event)" title="Zaznacz wszystkie zasoby">Wszystkie</button>
      <button type="button" class="bulk" (click)="setAll(false, $event)" title="Odznacz wszystkie zasoby">Żadne</button>
    </summary>
    <p class="kinds">
      @for (k of kinds; track k.name) {
        <span><span class="rim" [class.thick]="k.width > 1" [style.border-color]="k.border"></span>{{ k.name }}</span>
      }
    </p>
    @for (g of groups(); track g.name) {
      <section [attr.aria-label]="g.name">
        <button type="button" class="group" (click)="only(g.index)" [title]="'Pokaż tylko: ' + g.name">
          {{ g.name }}
        </button>
        <ul>
          @for (r of g.items; track r.index) {
            <li>
              <button
                type="button"
                class="item"
                [class.off]="!r.on"
                [class.absent]="r.count === 0"
                [attr.aria-pressed]="r.on"
                (click)="toggle(r.index)"
              >
                <span
                  class="swatch"
                  [class.thick]="(r.rim?.width ?? 0) > 1"
                  [style.background]="r.color"
                  [style.border-color]="r.rim?.border ?? 'transparent'"
                >
                  @if (r.icon) {
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      @for (s of icons[r.icon]; track $index) {
                        <path [attr.d]="s.d" [attr.fill]="s.fill" [attr.stroke]="s.stroke ?? null" [attr.stroke-width]="s.strokeWidth ?? null" />
                      }
                    </svg>
                  } @else if (r.symbol) {
                    <span class="symbol">{{ r.symbol }}</span>
                  }
                </span>
                <span class="name">{{ r.name }}</span>
                <span class="count" title="Liczba prowincji z tym zasobem">{{ r.count ?? '…' }}</span>
              </button>
            </li>
          }
        </ul>
      </section>
    }
  </details>
}
