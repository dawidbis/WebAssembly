[workspace]
resolver = "3"
members = ["crates/mapgen", "crates/core", "crates/wasm", "crates/server", "crates/ticket"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "11"

# Generator jest ciężki obliczeniowo: nawet w trybie dev kompilujemy zależności z optymalizacją.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Wspólne reguły clippy (CI: `cargo clippy -- -D warnings`). Wyjątki świadome:
[workspace.lints.clippy]
# Generator indeksuje kilka tablic tym samym `i` – pętla po indeksie jest tu czytelniejsza niż zip/enumerate.
needless_range_loop = "allow"
# Wiadomości protokołu i komend aktorów: serializowane albo krótko żyjące – rozmiar wariantu bez znaczenia.
large_enum_variant = "allow"
