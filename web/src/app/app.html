<div class="stage" #stage></div>
<!-- Górny pasek (HUD): wyjście do menu | zasoby państwa i odliczanie wyboru startu (środek) | kalendarz. -->
<header class="hud">
  <div class="hud-left">
    @if (lobby.inGame()) {
      <button type="button" class="exit" (click)="lobby.exitRequest.set(lobby.exitRequest() + 1)" title="Wyjdź z gry do menu głównego" aria-label="Wyjdź do menu">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M10 5H5v14h5M14 8l-4 4 4 4M10 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="exit-label">Menu</span>
      </button>
    }
  </div>
  <div class="hud-center">
    <app-resource-bar />
    <app-start-timer />
  </div>
  <div class="hud-right">
    <app-calendar />
  </div>
</header>
<!-- Rodzaje mapy (ikony w pionie) – lewa krawędź, pod przyciskiem wyjścia. -->
<div class="dock-top" [class.below-exit]="lobby.inGame()">
  <app-top-bar />
</div>
<!-- Lewy dolny róg: ramka prowincji. -->
<div class="dock-left">
  <app-province-info />
</div>
<app-resource-legend />
<app-stock-window />
<app-buildings-window />
<app-attack-panel />
<app-fronts-panel [class.raised]="store.view() === 'resources'" />
<app-radial-menu />
<app-loading />
<app-game-status />
<app-lobby-panel />
<ng-container #debugHost />
