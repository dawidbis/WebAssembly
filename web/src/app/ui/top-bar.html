<nav class="frame dock" aria-label="Widok mapy">
  <fieldset class="views">
    <legend class="sr-only">Rodzaj mapy</legend>
    @for (v of views; track v.view) {
      <label class="view-icon" [class.active]="store.view() === v.view" [title]="v.label + ' (' + v.key + ')'">
        <input type="radio" name="map-view" [checked]="store.view() === v.view" (change)="store.view.set(v.view)" [attr.aria-label]="v.label" />
        <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="v.icon" /></svg>
      </label>
    }
  </fieldset>

  <button type="button" class="dock-icon" (click)="store.requestFit()" title="Dopasuj widok do mapy (F)" aria-label="Dopasuj widok">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
  </button>
  <button
    type="button"
    class="dock-icon"
    [class.active]="optionsOpen()"
    (click)="optionsOpen.set(!optionsOpen())"
    [attr.aria-expanded]="optionsOpen()"
    aria-controls="render-options"
    title="Opcje wyświetlania"
    aria-label="Opcje wyświetlania"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7.4-2.1.1-1.4-.1-1.4 2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.4-1.4L14.2 2h-4l-.4 2.6c-.9.3-1.7.8-2.4 1.4l-2.4-1-2 3.4 2 1.6-.1 1.4.1 1.4-2 1.6 2 3.4 2.4-1c.7.6 1.5 1.1 2.4 1.4l.4 2.6h4l.4-2.6c.9-.3 1.7-.8 2.4-1.4l2.4 1 2-3.4-2-1.6Z"
      />
    </svg>
  </button>
</nav>

@if (optionsOpen()) {
  <fieldset id="render-options" class="frame options">
    <legend class="sr-only">Opcje wyświetlania</legend>
    <label class="check">
      <input type="checkbox" [checked]="store.showProvinces()" (change)="store.showProvinces.set(checked($event))" />
      Granice prowincji <kbd>P</kbd>
    </label>
    <label class="range" [class.off]="!store.showProvinces() || store.view() === 'political'">
      <span>Krycie granic prowincji</span>
      <input
        type="range"
        min="0.05"
        max="1"
        step="0.05"
        [value]="store.borderOpacity()"
        [disabled]="!store.showProvinces()"
        (input)="setOpacity($event)"
      />
    </label>
    @let t = store.territory();
    <fieldset class="group">
      <legend class="group-title">Państwa</legend>
      <label class="range" [class.off]="store.view() !== 'terrain'">
        <span>Krycie granic państw <small>(mapa terenu)</small></span>
        <input type="range" min="0" max="1" step="0.05" [value]="t.borderOpacity" (input)="setTerritory('borderOpacity', $event)" />
      </label>
      <div class="choice" role="radiogroup" aria-label="Tło terytoriów na mapie terenu">
        <span>Tło na mapie terenu</span>
        <label><input type="radio" name="territory-fill" [checked]="t.fill === 'color'" (change)="setFill('color')" /> Kolor</label>
        <label><input type="radio" name="territory-fill" [checked]="t.fill === 'flag'" (change)="setFill('flag')" /> Flaga</label>
      </div>
      <label class="range" [class.off]="t.fill !== 'color' || store.view() !== 'terrain'">
        <span>Krycie koloru</span>
        <input type="range" min="0" max="1" step="0.05" [value]="t.fillOpacity" (input)="setTerritory('fillOpacity', $event)" />
      </label>
      <label class="range" [class.off]="t.fill !== 'flag' || store.view() !== 'terrain'">
        <span>Krycie flagi</span>
        <input type="range" min="0" max="1" step="0.05" [value]="t.flagOpacity" (input)="setTerritory('flagOpacity', $event)" />
      </label>
      <label class="check">
        <input type="checkbox" [checked]="t.showNames" (change)="setNames(checked($event))" />
        Nazwy państw
      </label>
      <label class="range" [class.off]="!t.showNames">
        <span>Krycie nazw</span>
        <input type="range" min="0.1" max="1" step="0.05" [value]="t.namesOpacity" [disabled]="!t.showNames" (input)="setTerritory('namesOpacity', $event)" />
      </label>
    </fieldset>
    @let filter = store.buildingFilter();
    <fieldset class="group">
      <legend class="group-title">
        <label class="check">
          <input type="checkbox" [checked]="store.showBuildings()" (change)="store.setShowBuildings(checked($event))" />
          Budynki na mapie <kbd>B</kbd>
        </label>
      </legend>
      @for (b of buildingKinds; track b.kind; let i = $index) {
        <label class="check sub" [class.off]="!store.showBuildings()">
          <input
            type="checkbox"
            [checked]="filter[b.kind] !== false"
            [disabled]="!store.showBuildings()"
            (change)="store.setBuildingKind(b.kind, checked($event))"
          />
          {{ b.label }} <kbd>⇧{{ i + 1 }}</kbd>
        </label>
      }
    </fieldset>
    <label class="check">
      <input type="checkbox" [checked]="store.showContours()" (change)="store.showContours.set(checked($event))" />
      Izobaty <kbd>I</kbd>
    </label>
    <label class="check">
      <input type="checkbox" [checked]="store.showWaves()" (change)="store.showWaves.set(checked($event))" />
      Animacja wody <kbd>W</kbd>
    </label>
  </fieldset>
}
