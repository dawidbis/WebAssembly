[package]
name = "game-ticket"
edition.workspace = true
version.workspace = true

[dependencies]
game-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
# rust_crypto: czysty Rust (bez C/cmake) – prosta kroskompilacja na Linux arm64 (EC2, Lambda).
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
# Generowanie par kluczy PEM (`ticket keygen`, klucze testowe) – crate i tak jest w drzewie przez jsonwebtoken.
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
getrandom = "0.3"

[features]
# Deterministyczne klucze do testów (`test_keys::pair`) – dla testów game-servera i lobby.
test-keys = []

[lints]
workspace = true
