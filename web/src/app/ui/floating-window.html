<section
  class="frame window"
  [class.min]="minimized()"
  [style.left.px]="at().x"
  [style.top.px]="at().y"
  [style.width]="'min(' + width() + 'px, calc(100vw - 16px))'"
  [attr.aria-label]="title()"
>
  <header class="title-bar" (pointerdown)="drag($event)" title="Przeciągnij, aby przesunąć okno">
    <span class="title">{{ title() }}</span>
    <ng-content select="[title-extra]" />
    @if (minimizable()) {
      <button
        type="button"
        class="win-btn"
        (click)="toggleMin.emit()"
        [title]="minimized() ? 'Rozwiń' : 'Minimalizuj'"
        [attr.aria-label]="minimized() ? 'Rozwiń okno' : 'Minimalizuj okno'"
      >
        {{ minimized() ? '▢' : '–' }}
      </button>
    }
    <button type="button" class="win-btn" (click)="closed.emit()" title="Zamknij" aria-label="Zamknij okno">×</button>
  </header>
  @if (!minimized()) {
    <div class="body">
      <ng-content />
    </div>
  }
</section>
