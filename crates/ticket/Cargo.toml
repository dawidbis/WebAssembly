[package]
name = "game-ticket"
edition.workspace = true
version.workspace = true

[dependencies]
game-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
# rust_crypto: czysty Rust (bez C/cmake) – prosta kroskompilacja na Linux arm64 (EC2, Lambda).
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
# Tylko testy: generowanie par kluczy PEM (cecha `test-keys` – dla testów game-servera).
ed25519-dalek = { version = "2", optional = true, features = ["pkcs8", "pem"] }

[features]
test-keys = ["dep:ed25519-dalek"]

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
